# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    ignore:
      # Pinned to 1.x for the ESLint 10 migration. Both 2.x and 3.x require
      # eslint >=10 AND eslint-plugin-jsx-a11y >=6.10.2, whose latest release
      # (6.10.2) still caps at eslint ^9 — an unsatisfiable peer set that fails
      # installation with ERESOLVE. See ESLINT.md.
      - dependency-name: "eslint-plugin-astro"
        versions: [">=2"]
      - dependency-name: "astro-eslint-parser"
        versions: [">=2"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
